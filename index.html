<meta charset="utf-8">
<title>Sky Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Roboto+Condensed:wght@400&family=Roboto:wght@400;500&display=swap">

<style>
/* Tokens taken from the Figma file "playground start / constellation"
   (node 23:8249). A committed dark design — the page is a night sky. */
:root{
  --sky-1:#0d1729; --sky-2:#13244a; --sky-3:#0a1322;
  --glow:rgba(56,116,212,.55);

  --glass:rgba(0,0,0,.25);
  --stroke:#636363;          /* chip outline            */
  --stroke-card:#737373;     /* comparison card outline */
  --stroke-bar:#767676;      /* meter outline           */
  --fill-bar:#d9d9d9;        /* meter fill              */
  --img-tint:rgba(217,217,217,.2);
  --txt:#fff;
  --body-a:#c3c3c3; --body-b:#5d5d5d;

  --draw:#ffdd00;            /* the line you draw        */
  --official:#e2662b;        /* the official figure      */
  --other:#c9a2ff;           /* another culture's figure */
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--sky-3); color:var(--txt);
  font-family:Roboto,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--draw);outline-offset:2px}

#stage{position:relative;height:100%;width:100%;overflow:hidden;background:var(--sky-3)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#stage.panning #sky{cursor:grabbing}
#stage.lib #sky{cursor:default}
#glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(58% 42% at 44% 104%, var(--glow) 0%, rgba(30,70,150,.22) 44%, transparent 72%);
  mix-blend-mode:screen}

/* ---------- surfaces, straight from the file ---------- */
.glass{background:var(--glass);border-radius:30px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.chip{display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--stroke);border-radius:40px;padding:4px 12px;
  font-family:Roboto,sans-serif;font-size:12px;line-height:normal;color:var(--txt);white-space:nowrap;
  transition:background .15s,border-color .15s,opacity .15s}
button.chip:hover:not(:disabled){background:rgba(255,255,255,.1)}
button.chip:disabled{opacity:.3;cursor:default}
.chip.sel{background:rgba(255,255,255,.16);border-color:#fff}
.chip.lg{font-size:14px}

/* ---------- reading panel (Frame 1 — 403×1035, flush right) ---------- */
#panel{position:absolute;top:-16px;right:-28px;height:calc(100% + 32px);width:431px;
  padding:40px 78px 40px 24px;display:flex;flex-direction:column;gap:16px;
  overflow:hidden;transform:translateX(104%);
  transition:transform .5s cubic-bezier(.22,.9,.24,1)}
#panel.on{transform:none}
#panel .scroll{overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:16px;
  height:100%;width:329px;padding-bottom:76px;
  /* no scrollbar — content dissolves into the bottom edge instead */
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 96px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 96px),transparent 100%)}
#panel .scroll::-webkit-scrollbar{width:0;height:0;display:none}
/* Frame 11 — the block that carries title, chips and card, with its shadow */
.block{display:flex;flex-direction:column;width:329px;flex:0 0 auto;padding-bottom:16px;
  filter:drop-shadow(0 4px 4.8px rgba(0,0,0,.25))}
.closerow{height:19.125px;flex:0 0 auto}
#close{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));right:50px;
  width:19.125px;height:19.125px;border-radius:50%;
  border:1px solid var(--stroke);display:grid;place-items:center;
  font-size:11px;line-height:1;color:#cfcfcf;z-index:3}
#close:hover{background:rgba(255,255,255,.12);color:#fff}

.phead{display:flex;flex-direction:column;gap:12px;align-items:flex-start;flex:0 0 auto;
  margin-top:22px}
#name{margin:0;font-family:Roboto,sans-serif;font-weight:400;font-size:48px;line-height:normal;
  color:var(--txt);word-break:break-word}
#tags{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

/* the card outline is a gradient stroke — ~62% at the top, gone by the bottom */
.card{position:relative;border:0;border-radius:30px;padding:13px;
  display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:flex-end;
  width:329px;height:402px;flex:0 0 auto;margin-top:21.6px}
.card::before{content:'';position:absolute;inset:0;border-radius:30px;padding:1px;pointer-events:none;
  background:linear-gradient(180deg,rgba(115,115,115,.62) 0%,rgba(115,115,115,.30) 62%,rgba(115,115,115,0) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude}
.thumb{background:var(--img-tint);border-radius:17px;width:100%;flex:1 0 0;min-height:200px;
  position:relative;overflow:hidden}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.cmphead{display:flex;gap:4px;align-items:center;justify-content:center;width:100%}
.cmphead span{width:150px;text-align:center;font-family:Roboto,sans-serif;font-size:12px;color:var(--txt)}
.cmphead i{width:1px;height:24px;background:#767676;display:block}

#meters{width:100%;display:flex;flex-direction:column;gap:8px}
.meter{display:flex;gap:30px;align-items:flex-end;width:100%;text-align:left}
.meter .col{display:flex;flex-direction:column;gap:9px;align-items:flex-start;width:190px}
.meter .pct{font-family:Inter,sans-serif;font-size:12px;color:var(--txt);height:12px;line-height:12px;
  font-variant-numeric:tabular-nums}
.meter .track{width:190px;height:10px;border:1px solid var(--stroke-bar);border-radius:30px;position:relative}
.meter .fill{position:absolute;left:0;top:-1px;height:10px;border:1px solid var(--stroke-bar);
  border-radius:30px;background:var(--fill-bar);width:0;transition:width .8s cubic-bezier(.2,.9,.2,1)}
.meter .tag{font-family:"Roboto Condensed",sans-serif;font-size:12px;color:var(--txt);width:54px;
  line-height:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.meter{cursor:pointer;border-radius:8px;padding:2px 0}
button.meter .tag{opacity:.55}
button.meter:hover .tag{text-decoration:underline;opacity:1}
button.meter.sel .tag{opacity:1}
button.meter.sel .track{border-color:#fff}

/* one gradient across the whole body, not one per paragraph — the text
   falls away toward the bottom of the panel the way the file draws it */
.bodytext{padding:20px 0;width:100%;
  background:linear-gradient(180deg,var(--body-a) 0%,var(--body-b) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.bodytext p{margin:0 0 16px;font-family:Roboto,sans-serif;font-size:16px;line-height:1.45;
  color:transparent;background:none}
.bodytext p:last-child{margin-bottom:0}

/* ---------- bottom dock (Frame 14 — 522×137) ---------- */
.dock{position:absolute;bottom:-27px;left:calc(328px + (100% - 403px - 328px)/2);transform:translateX(-50%);
  width:522px;max-width:calc(100vw - 32px);min-height:137px;
  padding:24px 50px 51px 24px;display:flex;flex-direction:column;gap:16px;
  align-items:center;justify-content:flex-start}
.dock .row{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.chip.act{border-color:rgba(255,255,255,.75)}
button.chip.act:hover{background:rgba(255,255,255,.18)}
.dock .title{font-family:Roboto,sans-serif;font-size:24px;letter-spacing:3.84px;text-align:center;
  color:var(--txt);width:100%}

/* ---------- constellation map card, bottom left ---------- */
#libcard{position:absolute;left:24px;bottom:24px;width:288px;height:168px;border-radius:10px;
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.08);overflow:hidden;display:flex;align-items:center;gap:18px;
  padding:18px;text-align:left;transition:border-color .18s}
#libcard:hover{border-color:rgba(255,255,255,.28)}
#libcard canvas{width:132px;height:132px;flex:0 0 auto;border-radius:50%}
#libcard .meta{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 auto}
#libcard .k{font-family:"Roboto Condensed",sans-serif;font-size:11px;letter-spacing:1.6px;color:#9aa6b8;
  text-transform:uppercase;line-height:1.3}
#libcard .n{font-family:Roboto,sans-serif;font-size:28px;color:var(--txt);line-height:1}
#libcard .s{font-family:Roboto,sans-serif;font-size:12px;color:#8e9aac;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

#back{position:absolute;left:76px;top:71px;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.75);display:grid;place-items:center;color:#fff;z-index:4}
#back:hover{background:rgba(255,255,255,.14)}
#back svg{display:block}

#tip{position:absolute;pointer-events:none;padding:4px 12px;border:1px solid var(--stroke);
  border-radius:40px;background:rgba(0,0,0,.55);transform:translate(-50%,-160%);
  font-family:Roboto,sans-serif;font-size:12px;color:var(--txt);white-space:nowrap;
  opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip i{color:#9aa6b8;font-style:normal}

#caption{position:absolute;left:calc(328px + (100% - 403px - 328px)/2);transform:translateX(-50%);
  bottom:calc(var(--dockH,145px) - 13px);
  text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#caption.on{opacity:1}
#caption .a{font-family:Roboto,sans-serif;font-size:24px;letter-spacing:3.84px;color:var(--txt)}
#caption .b{font-family:"Roboto Condensed",sans-serif;font-size:12px;letter-spacing:2px;
  text-transform:uppercase;color:#9aa6b8;margin-top:6px}

@media (max-width:1280px){
  .dock,#caption{left:calc((100% - 403px)/2)}
  #libcard{width:214px;height:88px;padding:12px}
  #libcard canvas{width:64px;height:64px}
  #libcard .n{font-size:22px}
  #libcard .s{display:none}
}
@media (max-width:900px){
  #panel{width:100%;right:0;top:auto;bottom:0;height:min(78%,660px);padding:28px 20px;
    border-radius:30px 30px 0 0;transform:translateY(104%)}
  #panel.on{transform:none}
  #panel .scroll{width:100%}
  #close{top:22px;right:20px}
  #name{font-size:38px}
  .card{width:100%}
  .meter{gap:14px}
  .meter .col{width:auto;flex:1 1 auto}
  .meter .track{width:100%}
  .dock{left:50%;bottom:-27px;padding:20px 20px 47px;min-height:0}
  #libcard{width:calc(100% - 32px);left:16px;height:110px;bottom:176px}
  #libcard canvas{width:74px;height:74px}
  #libcard .n{font-size:22px}
  #libcard .s{display:none}
  #caption{left:50%;bottom:calc(var(--dockH,150px) - 13px)}
  #back{left:16px;top:16px}
  #stage.revealed #libcard,#stage.revealed .dock,#stage.revealed #caption{display:none}
}
@media (prefers-reduced-motion:reduce){
  #panel,.meter .fill{transition-duration:.01ms}
}
</style>

<div id="stage">
  <canvas id="sky"></canvas>
  <div id="glow"></div>

  <button id="back" title="Back to the sky" hidden>
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <path d="M11 3.5 5.5 9 11 14.5" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div id="tip"></div>
  <div id="caption"><div class="a"></div><div class="b"></div></div>

  <button id="libcard" title="Open your constellation map">
    <canvas id="libmini" width="328" height="328"></canvas>
    <span class="meta">
      <span class="k">Your map</span>
      <span class="n" id="libcount">0</span>
      <span class="s" id="libsub">Nothing charted yet. Join some stars and reveal what you drew.</span>
    </span>
  </button>

  <div class="dock glass" id="dock">
    <div class="row" id="dockrow"></div>
    <div class="title" id="docktitle">Draw a Sky</div>
  </div>

  <aside id="panel" class="glass" aria-live="polite">
    <button id="close" title="Close">&times;</button>
    <div class="scroll">
      <div class="block">
      <div class="closerow"></div>
      <div class="phead">
        <h1 id="name">Constellation</h1>
        <div id="tags"></div>
      </div>

      <div class="card">
        <div class="thumb"><canvas id="thumb" width="606" height="454"></canvas></div>
        <div class="cmphead"><span>What you drew</span><i></i><span>What it is</span></div>
        <div id="meters"></div>
      </div>
      </div>

      <div class="bodytext" id="body"></div>
    </div>
  </aside>
</div>

<script src="data/sky.js"></script>
<script src="data/western.js"></script>
<script src="data/variants.js"></script>
<script src="matcher.js"></script>
<script>
(function(){
'use strict';
var D2R = Math.PI/180, R2D = 180/Math.PI;
var SKY = window.SKY, WEST = window.WEST, VARIANTS = window.VARIANTS, M = window.Matcher;
var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ============================ stars ============================ */
var stars = [], byHip = new Map();
for (var i0=0;i0<SKY.stars.length;i0++){
  var s0 = SKY.stars[i0], ra0 = s0[1]*D2R, dec0 = s0[2]*D2R, cd0 = Math.cos(dec0);
  var st0 = { hip:s0[0], ra:s0[1], dec:s0[2], mag:s0[3], bv:s0[4],
              v:[cd0*Math.cos(ra0), cd0*Math.sin(ra0), Math.sin(dec0)],
              ph:Math.random()*6.283, x:0, y:0, on:false, r:0 };
  stars.push(st0); byHip.set(st0.hip, st0);
}
stars.sort(function(a,b){ return b.mag-a.mag; });
function vecOf(h){ var s = byHip.get(h); return s ? s.v : null; }

var STOPS = [[-0.34,167,190,255],[0.0,210,222,255],[0.32,250,249,255],
             [0.62,255,248,232],[1.0,255,222,176],[1.5,255,199,150],[2.0,255,176,132]];
function bvRGB(bv){
  var b = Math.max(-0.34, Math.min(2.0, bv||0.6)), i;
  for (i=1;i<STOPS.length;i++) if (b <= STOPS[i][0]) break;
  var a = STOPS[Math.max(0,i-1)], c = STOPS[Math.min(STOPS.length-1,i)];
  var t = (b-a[0])/((c[0]-a[0])||1);
  return [Math.round(a[1]+(c[1]-a[1])*t), Math.round(a[2]+(c[2]-a[2])*t), Math.round(a[3]+(c[3]-a[3])*t)];
}
for (var q0=0;q0<stars.length;q0++){
  var rgb0 = bvRGB(stars[q0].bv);
  stars[q0].col = rgb0;
  stars[q0].ck = (rgb0[0]>>4)+'_'+(rgb0[1]>>4)+'_'+(rgb0[2]>>4);
}
function starName(h){
  var n = SKY.names[h];
  if (!n) return {main:'HIP '+h, sub:''};
  if (n[0]) return {main:n[0], sub:(n[1]?n[1]+' ':'')+(n[2]||'')};
  if (n[1]) return {main:n[1]+' '+(n[2]||''), sub:'HIP '+h};
  return {main:'HIP '+h, sub:n[2]||''};
}

/* artwork is published flat, namespaced by sky culture */
(function(){
  var i, k, list;
  for (i=0;i<WEST.length;i++) if (WEST[i].art) WEST[i].art = 'western__' + WEST[i].art;
  for (k in VARIANTS){
    list = VARIANTS[k];
    for (i=0;i<list.length;i++) if (list[i].art) list[i].art = list[i].cid + '__' + list[i].art;
  }
})();

/* ============================ milky way ============================ */
var NGP_RA = 192.85948*D2R, NGP_DEC = 27.12825*D2R, L_NCP = 122.93192*D2R;
function gal2vec(l,b){
  l*=D2R; b*=D2R;
  var sb=Math.sin(b), cb=Math.cos(b), dl=L_NCP-l;
  var dec = Math.asin(sb*Math.sin(NGP_DEC) + cb*Math.cos(NGP_DEC)*Math.cos(dl));
  var y = cb*Math.sin(dl), x = sb*Math.cos(NGP_DEC) - cb*Math.sin(NGP_DEC)*Math.cos(dl);
  var ra = NGP_RA + Math.atan2(y,x), cdv = Math.cos(dec);
  return [cdv*Math.cos(ra), cdv*Math.sin(ra), Math.sin(dec)];
}
var mw = [], haze = [];
(function(){
  var rnd = (function(s){ return function(){ s=(s*1664525+1013904223)|0; return ((s>>>8)&0xffffff)/0xffffff; }; })(20260922);
  for (var i=0;i<1800;i++){
    var l = rnd()*360, near = Math.cos(l*D2R)*0.5+0.5, sig = 4.5+8*(1-near);
    var b = (rnd()+rnd()+rnd()-1.5)*sig;
    mw.push({ v:gal2vec(l,b), r:0.35+rnd()*1.1, a:(0.014+0.028*near)*(1-Math.min(1,Math.abs(b)/24)) });
  }
  for (var j=0;j<2600;j++) haze.push({ v:gal2vec(rnd()*360,(rnd()+rnd()+rnd()-1.5)*17), a:0.08+rnd()*0.26 });
})();

/* ============================ camera ============================ */
var cam = { ra:84, dec:4, fov:78 }, panelOpen = false;
var W=0,H=0,DPR=1,cx=0,cy=0,scale=1, fwd=[0,0,0], east=[0,0,0], up=[0,0,0];
function buildFrame(){
  var a=cam.ra*D2R, d=cam.dec*D2R, cdv=Math.cos(d), sdv=Math.sin(d);
  fwd=[cdv*Math.cos(a), cdv*Math.sin(a), sdv];
  east=[-Math.sin(a), Math.cos(a), 0];
  up=[-sdv*Math.cos(a), -sdv*Math.sin(a), cdv];
  var wide = W > 900;
  cx = (wide && panelOpen) ? (W-403)/2 : W/2;
  cy = (!wide && panelOpen) ? H*0.24 : H/2;
  scale = (Math.min(W, wide ? H : H*0.58)/2) / (2*Math.tan(cam.fov*D2R/4));
}
function proj(v,out){
  var z = v[0]*fwd[0]+v[1]*fwd[1]+v[2]*fwd[2];
  if (z < -0.25) return false;
  var k = 2/(1+z);
  if (!isFinite(k)) return false;
  out[0] = cx + (v[0]*east[0]+v[1]*east[1]+v[2]*east[2])*k*scale;
  out[1] = cy - (v[0]*up[0]+v[1]*up[1]+v[2]*up[2])*k*scale;
  return true;
}
function vecToRaDec(v){
  var ra = Math.atan2(v[1],v[0])*R2D; if (ra<0) ra+=360;
  return [ra, Math.asin(clamp(v[2],-1,1))*R2D];
}

/* ============================ canvas ============================ */
var cvs = $('sky'), ctx = cvs.getContext('2d');
var base = document.createElement('canvas'), bctx = base.getContext('2d');
var baseDirty = true;
function resize(){
  var r = $('stage').getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = Math.max(320, Math.round(r.width)); H = Math.max(320, Math.round(r.height));
  cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
  base.width = cvs.width; base.height = cvs.height;
  ctx.setTransform(DPR,0,0,DPR,0,0); bctx.setTransform(DPR,0,0,DPR,0,0);
  baseDirty = true;
}
new ResizeObserver(resize).observe($('stage'));
resize();

/* the dock grows upward as sky chips wrap; anything sitting above it follows */
(function(){
  var d = $('dock');
  var track = function(){
    document.documentElement.style.setProperty('--dockH', (d.offsetHeight || 145) + 'px');
  };
  new ResizeObserver(track).observe(d);
  track();
})();

var blobCvs = null;
function softBlob(){
  if (blobCvs) return blobCvs;
  var n=96, c=document.createElement('canvas'); c.width=c.height=n;
  var g=c.getContext('2d'), grd=g.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);
  grd.addColorStop(0,'rgba(198,214,248,1)');
  grd.addColorStop(.4,'rgba(176,196,240,.4)');
  grd.addColorStop(1,'rgba(164,186,236,0)');
  g.fillStyle=grd; g.fillRect(0,0,n,n);
  blobCvs=c; return c;
}
var sprites = new Map();
function sprite(ck, rgb, r){
  var rb = Math.max(0.6, Math.round(r*3)/3), key = ck+'|'+rb, c = sprites.get(key);
  if (c) return c;
  var R = rb*3.4+2.4, size = Math.ceil(R*2);
  c = document.createElement('canvas'); c.width=c.height=size;
  var g = c.getContext('2d'), grd = g.createRadialGradient(R,R,0,R,R,R);
  var col = rgb[0]+','+rgb[1]+','+rgb[2];
  grd.addColorStop(0,'rgba(255,255,255,.97)');
  grd.addColorStop(Math.min(.3, rb/R*0.95),'rgba('+col+',.92)');
  grd.addColorStop(.45,'rgba('+col+',.22)');
  grd.addColorStop(1,'rgba('+col+',0)');
  g.fillStyle=grd; g.fillRect(0,0,size,size);
  c._R = R; sprites.set(key,c); return c;
}

function drawBase(){

  var b = ((q1[1]-q0[1])*(p2[1]-p0[1]) - (q2[1]-q0[1])*(p1[1]-p0[1]))/d;

catalogue.forEach(function(c){ catByIau.set(c.fig.iau, c); });

/* ============================ frame loop ============================ */

    var k = Math.min(1,(now-anim.t0)/anim.dur), e = 1-Math.pow(1-k,3);
    cam.ra = anim.ra0+anim.dra*e;
    cam.dec = anim.dec0+(anim.dec1-anim.dec0)*e;
    cam.fov = anim.fov0*Math.pow(anim.fov1/anim.fov0, e);
    baseDirty = true;
    if (k >= 1) anim = null;
  }
  if (baseDirty){ buildFrame(); drawBase(); }

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  if (!reduceMotion){
    ctx.globalCompositeOperation='lighter';
    var tt = now/1000;

      var s = stars[i];

      var f = 0.5+0.5*Math.sin(tt*1.5+s.ph)*(0.5+0.5*Math.sin(tt*0.63+s.ph*2.1));

  if (reveal.on && chosen){

    var lineP = clamp((el-0.6)/1.15,0,1);

    var hue = (cultureId === 'western') ? '#e2662b' : '#c9a2ff';
    var ff = figFrame(spec);

    var lw = Math.max(1.4, 1.5*Math.min(2, 52/cam.fov)+0.6);

      drawSegs(ctx, figureSegments(spec, function(h){ var q=ff.pl.get(h); return q?mapFit(fp,q):null; }),

    for (j=1;j<path.length;j++){

    var dx=s.x-sx, dy=s.y-sy, d=dx*dx+dy*dy, w=d-(6.4-s.mag)*7;

cvs.addEventListener('pointerdown', function(e){

    if (pinch0 === null) pinch0 = { d:d, fov:cam.fov };

  hover = s;
  var tip = $('tip');
  if (s && !reveal.on){
    var nm = starName(s.hip);
    tip.innerHTML = esc(nm.main) + (nm.sub ? ' <i>'+esc(nm.sub)+'</i>' : '') + ' <i>m '+s.mag.toFixed(2)+'</i>';

/* ============================ reveal ============================ */
function flyTo(centre, fovDeg, dur){

           dec0:cam.dec, dec1:rd[1], fov0:cam.fov, fov1:f };
}
function drawnSpread(){
  var vs=[], i, v;
  for (i=0;i<path.length;i++){ v=vecOf(path[i]); if (v) vs.push(v); }

function doReveal(){

  if (sp) flyTo(sp.centre, Math.max(11, sp.radiusDeg*4.4), 850);

function chooseResult(iau){

function renderPanel(){
  var fig = chosen.cat.fig, spec = activeSpec(), rd = vecToRaDec(chosen.cat.centre);
  var isW = cultureId === 'western';

  $('tags').innerHTML =

    '<span class="chip">' + esc(isW ? fig.iau : (spec.en || fig.iau)) + '</span>';

  drawThumb();

  var top = results.slice(0,3);
  $('meters').innerHTML = top.map(function(r){

      ' title="' + esc(r.cat.fig.la||r.cat.fig.en) + '">' +

      '<span class="track"><span class="fill" data-w="' + pc + '"></span></span></span>' +

  }).join('');
  Array.prototype.forEach.call($('meters').querySelectorAll('.meter'), function(b){
    b.onclick = function(){ chooseResult(b.getAttribute('data-iau')); };
  });
  setTimeout(function(){
    Array.prototype.forEach.call($('meters').querySelectorAll('.fill'), function(f){
      f.style.width = Math.max(3, +f.getAttribute('data-w')) + '%';
    });
  }, 60);

  var paras = [];
  if (isW){
    paras.push(BLURB[fig.iau] || ('One of the 88 modern constellations. ' + (fig.la||fig.en) +
      ' is drawn here with the figure Stellarium uses for the Western sky.'));
    paras.push('Your line joined ' + path.length + ' stars across ' +
      (chosen.cat.radiusDeg*2).toFixed(0) + '° of sky. ' + chosen.shared + ' of them belong to the ' +
      (fig.la||fig.en) + ' figure, which is built from ' + chosen.cat.members.size + ' stars.');
    var vs = variantsFor();
    if (vs.length){
      var cults = [];
      for (var i=0;i<vs.length && cults.length<4;i++) if (cults.indexOf(vs[i].culture)<0) cults.push(vs[i].culture);
      paras.push(vs.length + ' other figure' + (vs.length===1?'':'s') + ' cross these same stars — ' +
        cults.join(', ') + (vs.length>cults.length?' and more':'') + '. Pick a sky below to draw theirs instead.');
    } else paras.push('No other sky culture in the archive draws a figure across these stars.');
  } else {
    paras.push(spec.desc || ((spec.native||spec.en) + ' is how the ' + (spec.culture||'') +
      ' sky draws these stars' + (spec.en && spec.native ? ', “' + spec.en + '”' : '') + '.'));
    paras.push('It shares ' + spec.inter + ' stars with the Western ' + (fig.la||fig.en) +
      ' and is built from ' + figureStars(spec).length + ' in total.');
    if (spec.pron) paras.push('Pronounced ' + spec.pron + '.');
  }
  $('body').innerHTML = paras.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
}

/* The card image: your line on the left, the WHOLE official figure on the
   right — every polyline it is built from, turned the same way the overlay
   in the sky turns it, so the two pictures always agree. */
function drawThumb(){
  var c = $('thumb'), g = c.getContext('2d'), Wc = c.width, Hc = c.height;
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,Wc,Hc);
  var spec = activeSpec(), fit = getFit(spec), ff = figFrame(spec);
  if (!fit || !ff) return;
  var half = Wc/2, i, j, v, p;

  /* your line, in the tangent plane at its own centre (y down, like screen) */
  var uv = [];
  for (i=0;i<path.length;i++){ v = vecOf(path[i]); if (v) uv.push(v); }
  if (uv.length < 2) return;
  var utp = M.tangentFrame(uv), U = [];
  for (i=0;i<uv.length;i++){ p = M.planeProject(uv[i], utp); if (p) U.push([p[0], -p[1]]); }
  if (U.length < 2) return;

  /* the figure, in its own plane, mirrored if that is how it matched */
  var refl = fit.res.reflected;
  function fpt(h){ var q = ff.pl.get(h); return q ? [q[0], refl ? q[1] : -q[1]] : null; }
  var polys = [];
  for (i=0;i<spec.lines.length;i++){
    var seg = [];
    for (j=0;j<spec.lines[i].p.length;j++){ var P = fpt(spec.lines[i].p[j]); if (P) seg.push(P); }
    if (seg.length >= 2) polys.push({ pts:seg, thin:spec.lines[i].t });
  }
  if (!polys.length) return;

  /* rotate the figure so its matched stroke lies the way your line lies */
  var Uw = fit.res.reversed ? U.slice().reverse() : U;
  var Un = M.resample(Uw, M.N), S = [];
  for (i=0;i<fit.res.desc.hips.length;i++){ var Q = fpt(fit.res.desc.hips[i]); if (Q) S.push(Q); }
  var Sn = M.resample(S, M.N), rot = null;
  if (Un && Sn && Un.length === Sn.length){
    var n = Un.length, ucx=0, ucy=0, scx=0, scy=0;
    for (i=0;i<n;i++){ ucx+=Un[i][0]; ucy+=Un[i][1]; scx+=Sn[i][0]; scy+=Sn[i][1]; }
    ucx/=n; ucy/=n; scx/=n; scy/=n;
    var re=0, im=0, den=0;
    for (i=0;i<n;i++){
      var ux=Un[i][0]-ucx, uy=Un[i][1]-ucy, sx=Sn[i][0]-scx, sy=Sn[i][1]-scy;
      re += ux*sx + uy*sy; im += uy*sx - ux*sy; den += sx*sx + sy*sy;
    }
    if (den > 1e-14) rot = { re:re/den, im:im/den, cx:scx, cy:scy };
  }
  function turn(q){
    if (!rot) return q;
    var x = q[0]-rot.cx, y = q[1]-rot.cy;
    return [rot.re*x - rot.im*y, rot.im*x + rot.re*y];
  }
  for (i=0;i<polys.length;i++) polys[i].pts = polys[i].pts.map(turn);

  /* each half auto-fits, so both shapes read at a comparable size */
  function plot(list, ox, colour, lw){
    var b = [1e9,-1e9,1e9,-1e9], k, m, q;
    for (k=0;k<list.length;k++) for (m=0;m<list[k].pts.length;m++){
      q = list[k].pts[m];
      if (q[0]<b[0]) b[0]=q[0]; if (q[0]>b[1]) b[1]=q[0];
      if (q[1]<b[2]) b[2]=q[1]; if (q[1]>b[3]) b[3]=q[1];
    }
    var pad = 44;
    var s = Math.min((half-pad*2)/Math.max(1e-9,b[1]-b[0]), (Hc-pad*2)/Math.max(1e-9,b[3]-b[2]));
    var mx = ox + half/2 - (b[0]+b[1])/2*s, my = Hc/2 - (b[2]+b[3])/2*s;
    g.save(); g.lineCap='round'; g.lineJoin='round';
    g.strokeStyle = colour; g.shadowColor = colour; g.shadowBlur = 12;
    for (k=0;k<list.length;k++){
      g.lineWidth = list[k].thin ? lw*0.6 : lw;
      g.globalAlpha = list[k].thin ? 0.55 : 1;
      g.beginPath();
      for (m=0;m<list[k].pts.length;m++){
        var px = mx + list[k].pts[m][0]*s, py = my + list[k].pts[m][1]*s;
        if (m) g.lineTo(px,py); else g.moveTo(px,py);
      }
      g.stroke();
    }
    g.restore();
  }
  plot([{pts:U, thin:0}], 0, '#ffdd00', 5);
  plot(polys, half, (cultureId==='western') ? '#e2662b' : '#c9a2ff', 4);
  g.save();
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(half, Hc*0.18); g.lineTo(half, Hc*0.82); g.stroke();
  g.restore();
}

/* ============================ the constellation map ============================ */
function recordDiscovery(){
  var id = chosen.cat.fig.iau, i;
  for (i=0;i<library.length;i++) if (library[i].id === id){
    library[i].hips = path.slice(); saveLibrary(library[i]); syncLib(); return;
  }
  var e = { id:id, iau:id, name:chosen.cat.fig.la || chosen.cat.fig.en,
            hips:path.slice(), score:Math.round(M.confidence(chosen.score)*100), at:Date.now() };
  library.push(e); saveLibrary(e); syncLib();
}
var db = null;
function saveLibrary(entry){
  try { localStorage.setItem('skysketch.library', JSON.stringify(library)); } catch(e){}
  if (db && entry) db.doc('discoveries/'+entry.id).set(entry).catch(function(){});
}
function loadLibrary(){
  try {
    var raw = localStorage.getItem('skysketch.library');
    if (raw) library = JSON.parse(raw) || [];
  } catch(e){ library = []; }
  syncLib();
  if (!(window.claude && window.claude.use)) return;
  window.claude.use('db').then(function(d){
    if (!d) return;
    db = d;
    return d.collection('discoveries').get().then(function(snap){
      var seen = {}, i;
      for (i=0;i<library.length;i++) seen[library[i].id] = 1;
      snap.docs.forEach(function(doc){
        var v = doc.data();
        if (v && v.id && !seen[v.id]){ library.push(v); seen[v.id] = 1; }
      });
      library.sort(function(a,b){ return (a.at||0)-(b.at||0); });
      syncLib();
    });
  }).catch(function(){});
}
/* the whole sky flattened to a disc: north pole at the centre, south at the rim */
function discXY(v, R){
  var rd = vecToRaDec(v), r = (90-rd[1])/180*R, th = rd[0]*D2R;
  return [Math.cos(th)*r, Math.sin(th)*r];
}
function entryPoints(e, R, blow){
  var raw = [], i, v;
  for (i=0;i<e.hips.length;i++){ v = vecOf(e.hips[i]); if (v) raw.push(discXY(v,R)); }
  if (!blow || raw.length < 2) return raw;
  var mx=0, my=0;
  for (i=0;i<raw.length;i++){ mx+=raw[i][0]; my+=raw[i][1]; }
  mx/=raw.length; my/=raw.length;
  var out = [];
  for (i=0;i<raw.length;i++) out.push([mx+(raw[i][0]-mx)*blow, my+(raw[i][1]-my)*blow]);
  return out;
}
function syncLib(){
  $('libcount').textContent = library.length;
  $('libsub').textContent = library.length
    ? library.slice(-3).reverse().map(function(e){ return e.name; }).join(' · ') +
      (library.length>3 ? ' and ' + (library.length-3) + ' more' : '')
    : 'Nothing charted yet. Join some stars and reveal what you drew.';
  var c = $('libmini'), g = c.getContext('2d'), R = c.width/2 - 8, i, j;
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,c.width,c.height);
  g.save(); g.translate(c.width/2, c.height/2);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1;
  g.beginPath(); g.arc(0,0,R,0,6.2832); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.12)';
  g.beginPath(); g.arc(0,0,R*0.5,0,6.2832); g.stroke();
  for (i=0;i<library.length;i++){
    var pp = entryPoints(library[i], R, 2.2);
    if (pp.length < 2) continue;
    g.strokeStyle = (i === library.length-1) ? '#ffdd00' : '#e2662b';
    g.lineWidth = 1.6; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath();
    for (j=0;j<pp.length;j++){ if (j) g.lineTo(pp[j][0],pp[j][1]); else g.moveTo(pp[j][0],pp[j][1]); }
    g.stroke();
  }
  g.restore();
}
var libHit = [], libHover = -1;
function libGeom(){
  var wide = W > 900, ox = wide ? W/2 - 40 : W/2, oy = H/2 + 22;
  return { ox:ox, oy:oy, R:Math.min(wide ? W-260 : W-40, H-190) * 0.46 };
}
function drawLibraryMap(){
  var G = libGeom(), i, j;
  ctx.save();
  ctx.translate(G.ox, G.oy);
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0,0,G.R,0,6.2832); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.arc(0,0,G.R*0.5,0,6.2832); ctx.stroke();
  libHit = [];
  for (i=0;i<library.length;i++){
    var pp = entryPoints(library[i], G.R, 2.6);
    if (pp.length < 2) continue;
    var on = (i === libHover) || (chosen && library[i].id === chosen.cat.fig.iau);
    ctx.strokeStyle = on ? '#ffdd00' : '#e2662b';
    ctx.lineWidth = on ? 3 : 2; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = on ? 16 : 8;
    ctx.beginPath();
    for (j=0;j<pp.length;j++){ if (j) ctx.lineTo(pp[j][0],pp[j][1]); else ctx.moveTo(pp[j][0],pp[j][1]); }
    ctx.stroke();
    ctx.shadowBlur = 0;
    var mx=0, my=0;
    for (j=0;j<pp.length;j++){ mx+=pp[j][0]; my+=pp[j][1]; }
    mx/=pp.length; my/=pp.length;
    libHit.push({ i:i, x:G.ox+mx, y:G.oy+my });
    if (on){
      ctx.font = '12px "Roboto Condensed", sans-serif';
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.fillText(String(library[i].name).toUpperCase(), mx, my + 26);
    }
  }
  ctx.restore();
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '24px Roboto, sans-serif'; ctx.fillStyle = '#fff';
  try { ctx.letterSpacing = '3.84px'; } catch(e){}
  ctx.fillText('Constellation Map', G.ox, G.oy - G.R - 46);
  try { ctx.letterSpacing = '0px'; } catch(e){}
  ctx.font = '12px "Roboto Condensed", sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillText(library.length
      ? library.length + (library.length===1 ? ' FIGURE CHARTED  ·  CLICK IT TO REOPEN'
                                             : ' FIGURES CHARTED  ·  CLICK ONE TO REOPEN')
      : 'NOTHING CHARTED YET  ·  GO BACK AND DRAW SOMETHING',
    G.ox, G.oy - G.R - 22);
  ctx.restore();
}
function hoverLibrary(p){
  var best=-1, bd=44*44;
  for (var i=0;i<libHit.length;i++){
    var dx = libHit[i].x-p[0], dy = libHit[i].y-p[1], d = dx*dx+dy*dy;
    if (d < bd){ bd = d; best = libHit[i].i; }
  }
  libHover = best;
}
function clickLibrary(x,y){
  hoverLibrary([x,y]);
  if (libHover < 0) return;
  var e = library[libHover];
  closeLibrary();
  path = e.hips.slice();
  fitCache.clear();
  setTimeout(doReveal, 60);
}
$('libcard').onclick = openLibrary;
$('back').onclick = closeLibrary;
function openLibrary(){
